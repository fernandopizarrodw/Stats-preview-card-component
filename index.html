<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Stats preview card component</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container">
      
      <div class="card-text">
        <h1>Get <strong>insights</strong> that help your business grow.</h1>
        <p>
          Discover the benefits of data analytics and make better decisions
          regarding revenue, customer experience, and overall efficiency.
        </p>
        <div class="data-wrapper">
          <div class="data-group">
            <span class="data-number">10k+</span>
            <span class="data-text">companies</span>
          </div>
          <div class="data-group">
            <span class="data-number">314</span>
            <span class="data-text">templates</span>
          </div>
          <div class="data-group">
            <span class="data-number">12M+</span>
            <span class="data-text">queries</span>
          </div>
        </div>
      </div>
      <div class="card-image"></div>
    </main>
    <footer>
      <div class="attribution">
        Challenge by
        <a
          href="https://www.frontendmentor.io?ref=challenge"
          target="_blank"
          >Frontend Mentor.</a
        > Coded by <a href="#">Fernando Pizarro.</a>
      </div>
    </footer>
  </body>
</html>
